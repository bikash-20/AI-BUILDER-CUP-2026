<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Animation - Bell</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #1a1a1a 0%, #000 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  .title {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 60px;
    text-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
  }

  .scene {
    position: relative;
    width: 320px;
    height: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  /* The rope/string holding the bell */
  .rope {
    width: 2px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, #888 50%, #444);
    margin-bottom: -10px;
  }

  /* Bell container — handles the swing */
  .bell-wrapper {
    position: relative;
    transform-origin: 50% 0;
    animation: swing 3s ease-in-out infinite;
    cursor: pointer;
  }

  .bell {
    position: relative;
    width: 160px;
    height: 160px;
    background: radial-gradient(circle at 50% 30%, #555 0%, #2a2a2a 60%, #111 100%);
    border-radius: 50% 50% 45% 45% / 35% 35% 65% 65%;
    box-shadow:
      inset 0 -20px 30px rgba(0, 0, 0, 0.8),
      inset 0 10px 20px rgba(255, 255, 255, 0.1),
      0 10px 30px rgba(0, 0, 0, 0.8);
  }

  /* The bell's rim/lip */
  .bell::before {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 170px;
    height: 22px;
    background: radial-gradient(ellipse at center, #666 0%, #2a2a2a 70%, #111 100%);
    border-radius: 50%;
    box-shadow:
      inset 0 4px 8px rgba(255, 255, 255, 0.15),
      inset 0 -4px 8px rgba(0, 0, 0, 0.8);
  }

  /* The inner light/glow of the bell */
  .bell::after {
    content: "";
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 12px;
    background: radial-gradient(ellipse at center,
      rgba(255, 220, 150, 1) 0%,
      rgba(255, 180, 80, 0.8) 30%,
      rgba(255, 140, 40, 0.4) 60%,
      transparent 100%);
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0;
    transition: opacity 0.6s ease-in-out, filter 0.6s ease-in-out;
  }

  /* Clapper hanging inside the bell */
  .clapper {
    position: absolute;
    bottom: -25px;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 18px;
    background: radial-gradient(circle at 30% 30%, #777, #222);
    border-radius: 50%;
    box-shadow:
      inset 0 -3px 5px rgba(0, 0, 0, 0.8),
      0 2px 8px rgba(0, 0, 0, 0.6);
    z-index: -1;
    animation: clapperMove 3s ease-in-out infinite;
  }

  /* The bell swings gently */
  @keyframes swing {
    0%, 100% { transform: rotate(0deg); }
    15% { transform: rotate(8deg); }
    30% { transform: rotate(-8deg); }
    45% { transform: rotate(6deg); }
    60% { transform: rotate(-6deg); }
    75% { transform: rotate(3deg); }
    90% { transform: rotate(-3deg); }
  }

  /* Clapper moves in sync */
  @keyframes clapperMove {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    25% { transform: translateX(-50%) translateY(3px) translateX(-4px); }
    50% { transform: translateX(-50%) translateY(3px) translateX(4px); }
    75% { transform: translateX(-50%) translateY(2px) translateX(-2px); }
  }

  /* The floor reflection / glow puddle */
  .floor-glow {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 30px;
    background: radial-gradient(ellipse at center,
      rgba(255, 180, 80, 0.5) 0%,
      rgba(255, 140, 40, 0.3) 30%,
      rgba(255, 100, 20, 0.1) 60%,
      transparent 100%);
    border-radius: 50%;
    filter: blur(8px);
    opacity: 0;
    transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
  }

  /* ===== ON state — bulb is lit ===== */
  body.on .bell::after {
    opacity: 1;
    animation: glowPulse 3s ease-in-out infinite;
  }

  body.on .floor-glow {
    opacity: 1;
    animation: floorPulse 3s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% {
      opacity: 0.7;
      filter: blur(2px) brightness(1);
    }
    50% {
      opacity: 1;
      filter: blur(3px) brightness(1.3);
    }
  }

  @keyframes floorPulse {
    0%, 100% {
      opacity: 0.5;
      transform: translateX(-50%) scaleX(1);
    }
    50% {
      opacity: 0.95;
      transform: translateX(-50%) scaleX(1.2);
    }
  }

  /* ===== OFF state — everything is dim and dark ===== */
  body.off .bell {
    filter: brightness(0.55) saturate(0.6);
  }

  body.off .bell::after,
  body.off .floor-glow {
    opacity: 0 !important;
    animation: none !important;
  }

  /* Notify Me button */
  .notify-btn {
    margin-top: 60px;
    padding: 12px 32px;
    background: linear-gradient(to bottom, #4a4a4a, #2a2a2a);
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.2),
      inset 0 -1px 1px rgba(0, 0, 0, 0.4),
      0 4px 12px rgba(0, 0, 0, 0.6);
    transition:
      filter 0.4s ease-in-out,
      box-shadow 0.4s ease-in-out,
      opacity 0.4s ease-in-out,
      color 0.4s ease-in-out,
      background 0.4s ease-in-out,
      text-shadow 0.4s ease-in-out;
  }

  .notify-btn:hover {
    background: linear-gradient(to bottom, #ffb74d, #ff8a00);
    border-color: #ffb74d;
    color: #fff;
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.4),
      0 0 30px rgba(255, 150, 50, 0.8),
      0 0 60px rgba(255, 100, 20, 0.4);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    filter: brightness(1.15);
  }

  /* Hard ring pulse on the bell when toggled on */
  .bell-wrapper.ring {
    animation: hardSwing 1s ease-in-out;
  }

  @keyframes hardSwing {
    0% { transform: rotate(0deg); }
    20% { transform: rotate(15deg); }
    40% { transform: rotate(-15deg); }
    60% { transform: rotate(12deg); }
    80% { transform: rotate(-12deg); }
    100% { transform: rotate(0deg); }
  }
</style>
</head>
<body class="off">

  <h1 class="title">CSS Animation</h1>

  <div class="scene">
    <div class="rope"></div>

    <div class="bell-wrapper" id="bell">
      <div class="bell"></div>
      <div class="clapper"></div>
    </div>

    <div class="floor-glow"></div>

    <button class="notify-btn">Notify Me</button>
  </div>

<script>
  const bell  = document.getElementById('bell');
  const btn   = document.querySelector('.notify-btn');
  const body  = document.body;

  // Click the bell (the "bulb") or the button — toggles the light on/off
  function toggle() {
    const isOn = body.classList.contains('on');
    if (isOn) {
      body.classList.remove('on');
      body.classList.add('off');
    } else {
      body.classList.remove('off');
      body.classList.add('on');
      // ring once when turning on
      bell.classList.remove('ring');
      void bell.offsetWidth;
      bell.classList.add('ring');
    }
  }

  bell.addEventListener('click', toggle);
  btn.addEventListener('click', toggle);
</script>

</body>
</html>
