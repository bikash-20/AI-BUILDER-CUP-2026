# Cloud Deploy: risk-service delivery pipeline.
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: finguard-risk-service
description: FinGuard risk-service — progressive delivery
serialPipeline:
  stages:
    - targetId: finguard-dev-risk-service
      profiles: [dev]
    - targetId: finguard-staging-risk-service
      profiles: [staging]
    - targetId: finguard-prod-risk-service
      profiles: [prod]
      strategy:
        canary:
          canaryDeployment:
            percentages: [50, 100]
            verify: true

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: finguard-dev-risk-service
description: dev
run:
  location: projects/${PROJECT_ID}/locations/us-central1

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: finguard-staging-risk-service
description: staging
run:
  location: projects/${PROJECT_ID}/locations/us-central1

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: finguard-prod-risk-service
description: prod
run:
  location: projects/${PROJECT_ID}/locations/us-central1
requireApproval: true
