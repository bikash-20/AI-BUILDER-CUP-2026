# Cloud Deploy: fraud-service delivery pipeline.
#
# Stages: dev → staging → prod (canary 25% → 50% → 100%).
# Approved by an SRE on each promotion.

apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: finguard-fraud-service
description: FinGuard fraud-service — progressive delivery
serialPipeline:
  stages:
    - targetId: finguard-dev-fraud-service
      profiles: [dev]
    - targetId: finguard-staging-fraud-service
      profiles: [staging]
      # Wait 10 minutes for canary metrics before promoting to prod.
      deployParameters:
        - values:
            deployParameterKey: canary_runtime
            units: MINUTES
            value: "10"
    - targetId: finguard-prod-fraud-service
      profiles: [prod]
      strategy:
        canary:
          canaryDeployment:
            percentages: [25, 50, 100]
            verify: true
          runtimeConfig:
            cloudRun:
              automaticTrafficControl: true
              canaryRevisionTags: [canary]

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: finguard-dev-fraud-service
description: dev
run:
  location: projects/${PROJECT_ID}/locations/us-central1

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: finguard-staging-fraud-service
description: staging
run:
  location: projects/${PROJECT_ID}/locations/us-central1

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: finguard-prod-fraud-service
description: prod
run:
  location: projects/${PROJECT_ID}/locations/us-central1
requireApproval: true
