# Cloud Deploy: frontend delivery pipeline.
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: finguard-frontend
description: FinGuard frontend (Next.js) — progressive delivery
serialPipeline:
  stages:
    - targetId: finguard-dev-frontend
      profiles: [dev]
    - targetId: finguard-staging-frontend
      profiles: [staging]
    - targetId: finguard-prod-frontend
      profiles: [prod]
      strategy:
        canary:
          canaryDeployment:
            percentages: [25, 50, 100]
            verify: true

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: finguard-dev-frontend
description: dev
run:
  location: projects/${PROJECT_ID}/locations/us-central1

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: finguard-staging-frontend
description: staging
run:
  location: projects/${PROJECT_ID}/locations/us-central1

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: finguard-prod-frontend
description: prod
run:
  location: projects/${PROJECT_ID}/locations/us-central1
requireApproval: true
