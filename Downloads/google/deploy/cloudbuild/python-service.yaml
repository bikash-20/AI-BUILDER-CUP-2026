# Cloud Build pipeline for any Python service in ml/services/<name>.
#
# Usage:
#   gcloud builds submit --config=deploy/cloudbuild/python-service.yaml \
#     --substitutions=_SERVICE=gemini_service,_REGION=us-central1

steps:
  # 1) Install dependencies and run unit tests.
  - name: gcr.io/cloud-builders/python:3.11
    entrypoint: pip
    args:
      - install
      - -r
      - ml/services/${_SERVICE}/requirements.txt
    dir: .

  - name: gcr.io/cloud-builders/python:3.11
    entrypoint: pytest
    args:
      - -q
      - ml/services/${_SERVICE}/tests
    dir: .

  # 2) Build the container image from the service's Dockerfile.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ml/services/${_SERVICE}/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/finguard/${_SERVICE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/finguard/${_SERVICE}:latest
      - .

  # 3) Push images.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/finguard/${_SERVICE}

  # 4) Cloud Deploy release.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - deploy
      - releases
      - create
      - ${_SERVICE}-${SHORT_SHA}
      - --delivery-pipeline=finguard-${_SERVICE}
      - --region=${_REGION}
      - --images=${_SERVICE}=${_REGION}-docker.pkg.dev/${PROJECT_ID}/finguard/${_SERVICE}:${SHORT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/finguard/${_SERVICE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/finguard/${_SERVICE}:latest

substitutions:
  _SERVICE: gemini_service
  _REGION: us-central1
  SHORT_SHA: ${COMMIT_SHA:0:7}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
