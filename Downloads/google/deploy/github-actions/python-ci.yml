name: python-ci

on:
  push:
    paths:
      - "ml/**"
      - "dataflow/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "ml/**"
      - "dataflow/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [ml, dataflow]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Test (pytest)
        run: |
          pytest -q
